main{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 20px calc(36px + env(safe-area-inset-bottom,0px));animation:in .8s ease-out both}
@keyframes in{from{opacity:0}to{opacity:1}}
.top{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px}
h1{margin:0;font-weight:400;font-size:clamp(40px,11vw,72px);line-height:1;letter-spacing:-.05em;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.cards{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
@media (min-aspect-ratio:1/1){main{justify-content:center;gap:36px}.top{flex:none;min-height:0}}

.card{position:relative;display:block;overflow:hidden;isolation:isolate;color:var(--text);text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:10px;
  background:linear-gradient(135deg,rgba(120,140,155,.28),rgba(20,30,42,.42) 55%,rgba(20,30,42,.5));
  -webkit-backdrop-filter:blur(24px) saturate(115%);backdrop-filter:blur(24px) saturate(115%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.25);transition:border-color .2s,background .2s}
.card:hover{border-color:rgba(255,255,255,.3)}
.card:focus-visible,.head:focus-visible,.opt:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.link,.head{position:relative;display:block;width:100%;padding:15px 44px 15px 18px;text-align:left;color:inherit;font:inherit;text-decoration:none;cursor:pointer}
.head{background:none;border:0}
.name{display:block;font-size:18px;letter-spacing:.02em}
.kind{display:block;margin-top:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.arr{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted);transition:transform .3s}

.sub{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}
.pl.open .sub{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease}
.pl.open .arr{transform:translateY(-50%) rotate(45deg)}
.subin{overflow:hidden}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--edge);color:var(--text);text-decoration:none;font-size:15px;letter-spacing:.02em}
.opt span{color:var(--muted);font-size:16px}
.opt:hover{background:rgba(255,255,255,.08)}
@media (prefers-reduced-motion:reduce){main{animation:none}.sub,.arr{transition:none}}
</style>
</head>
<body>
<div class="bg" role="img" aria-label="River at dusk under a cloudy sky"></div>
<main>
  <div class="top"><h1>socials</h1></div>
  <div class="cards">
    <a class="card link" href="https://t.me/createdgalaxy" target="_blank" rel="noopener">
      <span class="name">public</span><span class="kind">telegram channel</span><span class="arr">↗</span>
    </a>
    <a class="card link" href="https://t.me/necrofil" target="_blank" rel="noopener">
      <span class="name">direct</span><span class="kind">telegram</span><span class="arr">↗</span>
    </a>
    <div class="card pl" id="pl">
      <button class="head" type="button" id="plbtn" aria-expanded="false" aria-controls="plsub">
        <span class="name">playlist</span><span class="kind">spotify / youtube</span><span class="arr">+</span>
      </button>
      <div class="sub" id="plsub"><div class="subin">
        <a class="opt" href="https://open.spotify.com/playlist/09LIy3b9ARWne27Mp4oKG1?si=wUSJGnmESx2alkAOG5aVSA&amp;utm_source=copy-link&amp;pi=lOswX0vaQsWOZ" target="_blank" rel="noopener">spotify<span>↗</span></a>
        <a class="opt" href="https://youtube.com/playlist?list=PLenFyFzvXoOg&amp;si=Gg8wDt30-RgKPCGN" target="_blank" rel="noopener">youtube<span>↗</span></a>
      </div></div>
    </div>
  </div>
</main>
<script>
(function(){
  var pl=document.getElementById('pl'),btn=document.getElementById('plbtn');
  btn.addEventListener('click',function(){
    var o=pl.classList.toggle('open');btn.setAttribute('aria-expanded',o);
  });
})();
</script>
</body>
</html>
